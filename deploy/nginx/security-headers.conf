# =============================================================================
# LAILA — SPA document security headers (HTTPS hosts)
# =============================================================================
# Generated from server/src/config/csp.ts. Regenerate with:
#
#     cd server && npm run csp:generate
#
# Do not hand-edit between the markers — the next generate overwrites it, and
# `npm run csp:check` fails in the meantime.
#
# WHY A SNIPPET: an already-installed host does not pick up deploy.sh's inline
# nginx configs — those are only written during install, and re-running the
# installer would overwrite the live server/.env. This file can be dropped in
# and included without rewriting a config certbot may be managing.
#
# INSTALL:  sudo bash deploy/update-nginx-headers.sh
#
# THEN add this line inside the SPA `location / { … }` block of your site
# config, AND inside any nested location that sets its own add_header —
# nginx drops every inherited header from a location that declares one of its
# own, and does not cascade into nested locations:
#
#     include /etc/nginx/snippets/laila-security-headers.conf;
#
# HTTPS ONLY. This sets Strict-Transport-Security and upgrade-insecure-requests.
# On a plaintext listener HSTS would pin the host to an https it cannot serve,
# and upgrade-insecure-requests would rewrite every subresource request and
# break asset loading. deploy.sh's inline configs carry the http variant
# already, so they do not need this file.
# =============================================================================

# >>> laila-security-headers https >>>
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: https://webr.r-wasm.org https://repo.r-wasm.org https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# <<< laila-security-headers <<<
