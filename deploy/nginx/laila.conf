# =============================================================================
# LAILA — Nginx Reverse Proxy Configuration
# =============================================================================
# Placeholders replaced by deploy.sh:
#   __DOMAIN__      → your domain (e.g. laila.example.com)
#   __INSTALL_DIR__ → absolute path to the LAILA-v3 project root
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # --- SSL (managed by Certbot) -------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ----------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Upload size ---------------------------------------------------------
    # Conservative default for the SPA and static locations. The API overrides
    # this per-location because it accepts large media uploads.
    client_max_body_size 10M;

    # --- OIDC discovery ------------------------------------------------------
    # RFC 8414 fixes this path at the issuer root, so it cannot be moved under
    # /api/ where the rest of the OIDC endpoints live. Without this exact-match
    # location it falls through to the SPA catch-all below and is answered with
    # index.html from disk, so a relying party (chatoyon) gets HTML where it
    # expects JSON and cannot discover LAILA at all.
    #
    # Exact match (`=`) so it cannot shadow /.well-known/acme-challenge/, which
    # certbot serves from the HTTP server block.
    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API proxy -----------------------------------------------------------
    location /api/ {
        # Must clear the largest server-side multer limit (lecture videos are
        # 200MB in upload.routes.ts). At 10M every video/large-file upload died
        # at nginx with an HTML 413 the SPA cannot parse. Multer still enforces
        # the real per-type ceilings; this only stops nginx truncating first.
        client_max_body_size 200M;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI requests
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # --- Socket.IO WebSocket proxy -------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # --- Uploaded files proxy ------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets (client build) ----------------------------------------
    location /assets/ {
        alias __INSTALL_DIR__/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA catch-all -------------------------------------------------------
    location / {
        root __INSTALL_DIR__/client/dist;
        try_files $uri $uri/ /index.html;

        # Content-Security-Policy for the SPA document. The Express helmet CSP
        # only reaches proxied /api + /uploads responses; the index.html is
        # served from disk here, so without this an XSS on the SPA would run
        # with no CSP at all.
        # NOTE: a location that sets add_header does NOT inherit the server-level
        # security headers, so they are re-declared here.
        # Generated from server/src/config/csp.ts — run `npm run csp:generate`
        # in server/ after changing it. Do not hand-edit inside the markers.
        # >>> laila-security-headers https >>>
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: https://webr.r-wasm.org https://repo.r-wasm.org https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # <<< laila-security-headers <<<

        # Cache HTML for a short time (SPA entry point)
        location = /index.html {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            # add_header does not cascade into nested locations either — repeat.
            # >>> laila-security-headers https >>>
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: https://webr.r-wasm.org https://repo.r-wasm.org https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; upgrade-insecure-requests" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # <<< laila-security-headers <<<
        }
    }
}
